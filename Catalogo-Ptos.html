<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<style>
:root{--bg:#F5F7F5;--surface:#fff;--surface-2:#EBF2ED;--border:#D3E0D7;--fg:#0F1A13;--fg-2:#3A4F3F;--fg-3:#7A9080;--green:#1B5E42;--green-dark:#124030;--green-light:#E4F0EB;--orange:#F97316;--shadow-sm:0 1px 3px rgba(15,26,19,.07);--shadow-lg:0 12px 40px rgba(15,26,19,.13);--radius-lg:18px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A120D;--surface:#111A14;--surface-2:#182210;--border:#243020;--fg:#E2EDE5;--fg-2:#8AA890;--fg-3:#4D6652;--green:#3DB87A;--green-dark:#2DA068;--green-light:#0D2718;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A120D;--surface:#111A14;--surface-2:#182210;--border:#243020;--fg:#E2EDE5;--fg-2:#8AA890;--fg-3:#4D6652;--green:#3DB87A;--green-dark:#2DA068;--green-light:#0D2718;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6;background:var(--bg);color:var(--fg);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:101}
img{max-width:100%;display:block}
.container{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.nav-inner{display:flex;align-items:center;height:62px;gap:12px}
.nav-logo{height:28px;width:auto}
.nav-back{margin-left:auto;padding:8px 16px;background:var(--green-light);color:var(--green);border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.nav-back:hover{background:var(--green);color:#fff}
.hero{background:var(--green);padding:36px 0 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 90% 50%,rgba(255,255,255,.07) 0%,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:10px}
.hero-title{font-family:'Sora',sans-serif;font-size:clamp(22px,3vw,34px);font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:8px}
.hero-sub{font-size:14px;color:rgba(255,255,255,.75);max-width:500px}
.hero-count{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;color:#F97316}
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:62px;z-index:90}
.toolbar-inner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3);pointer-events:none}
#searchInput{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg);font-size:14px;outline:none}
#searchInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--fg-2);transition:all .12s;white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.sort-select{padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--fg);font-size:13px;cursor:pointer;outline:none;flex-shrink:0}
.catalog-layout{padding:20px 0 48px}
.results-info{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.results-count{font-size:13px;color:var(--fg-3)}
.loading-bar{font-size:13px;color:var(--green);font-weight:600}
.pagination{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.page-btn{padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--fg-2);font-size:13px;cursor:pointer;font-weight:500;min-width:34px}
.page-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.page-btn:disabled{opacity:.4;cursor:default}
.page-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.page-info{font-size:13px;color:var(--fg-3);padding:0 2px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow .18s,transform .18s,border-color .18s;cursor:pointer}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:var(--green)}
.card-img-wrap{width:100%;aspect-ratio:1;background:var(--surface);position:relative;overflow:hidden}
.card-img{width:100%;height:100%;object-fit:contain;padding:14px}
.card-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--surface-2)}
.card-body{padding:12px 14px 14px}
.card-brand{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.card-brand-logo{height:14px;width:auto;object-fit:contain;opacity:.8}
.card-brand-name{font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.04em}
.card-title{font-family:'Sora',sans-serif;font-size:12.5px;font-weight:600;color:var(--fg);line-height:1.35;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sku{font-size:11px;color:var(--fg-3);margin-bottom:7px;font-family:monospace}
.card-price{font-family:'Sora',sans-serif;font-size:18px;font-weight:800;color:var(--green)}
.card-price-label{font-size:10px;color:var(--fg-3);font-weight:400;display:block;margin-top:1px}
.card-stock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;margin-top:7px;background:var(--green-light);color:var(--green)}
.card-cta{width:100%;margin-top:10px;padding:8px;background:var(--green);color:#fff;border:none;border-radius:8px;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;cursor:pointer}
.card-cta:hover{background:var(--green-dark)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.96);transition:transform .2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-cat{font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.modal-close{background:none;border:none;cursor:pointer;color:var(--fg-3);padding:4px 8px;border-radius:6px;font-size:18px}
.modal-close:hover{color:var(--fg);background:var(--surface-2)}
.modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.modal-img{aspect-ratio:1;object-fit:contain;width:100%;border-radius:12px;background:var(--surface-2);padding:16px}
.modal-brand{font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.modal-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:var(--fg);line-height:1.3;margin-bottom:14px}
.modal-price{font-family:'Sora',sans-serif;font-size:30px;font-weight:800;color:var(--green)}
.modal-price-note{font-size:11px;color:var(--fg-3);margin-bottom:16px}
.modal-specs{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.spec-row{display:flex;padding:7px 12px;border-bottom:1px solid var(--border);font-size:13px}
.spec-row:last-child{border-bottom:none}
.spec-label{color:var(--fg-3);width:90px;flex-shrink:0;font-weight:500}
.spec-val{color:var(--fg)}
.modal-feats{margin-top:14px}
.modal-feats h4{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;color:var(--fg);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.feat-item{display:flex;gap:8px;font-size:13px;color:var(--fg-2);margin-bottom:5px;line-height:1.4}
.feat-item::before{content:"✓";color:var(--green);font-weight:700;flex-shrink:0}
.modal-cta{padding:0 20px 20px;display:flex;gap:10px;flex-wrap:wrap}
.btn-green{padding:11px 20px;background:var(--green);color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;cursor:pointer;flex:1}
.btn-green:hover{background:var(--green-dark)}
.btn-wa{padding:11px 18px;background:#25D366;color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:7px;text-decoration:none}
.btn-wa:hover{opacity:.9}
.empty{text-align:center;padding:64px 20px;color:var(--fg-3)}
.empty-icon{font-size:48px;margin-bottom:12px}
@media(max-width:700px){.modal-body{grid-template-columns:1fr}.products-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
@media(max-width:420px){.products-grid{grid-template-columns:1fr 1fr}}
/* ── Carrito ── */
.cart-fab{position:fixed;bottom:24px;right:24px;z-index:900;background:var(--green);color:#fff;border:none;border-radius:50px;padding:13px 20px;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;transition:transform .15s}
.cart-fab:hover{transform:scale(1.05)}
.cart-badge{background:#F97316;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;align-items:center;justify-content:center}
.cart-overlay.open{display:flex}
.cart-panel{background:var(--surface);border-radius:16px;width:min(600px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.cart-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-header h2{font-size:18px;font-weight:700;color:var(--fg)}
.cart-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--fg-2);line-height:1}
.cart-items{flex:1;overflow-y:auto;padding:12px 20px}
.cart-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-img{width:52px;height:52px;object-fit:contain;border-radius:8px;background:var(--surface-2)}
.cart-item-name{font-size:13px;font-weight:600;color:var(--fg);line-height:1.3}
.cart-item-brand{font-size:12px;color:var(--fg-3);margin-top:2px}
.cart-item-price{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;text-align:right}
.cart-item-controls{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:14px;font-weight:700;color:var(--fg);display:flex;align-items:center;justify-content:center;line-height:1}
.qty-val{font-size:13px;font-weight:600;min-width:20px;text-align:center;color:var(--fg)}
.cart-remove{background:none;border:none;cursor:pointer;color:var(--fg-3);font-size:18px;padding:0 4px;line-height:1}
.cart-remove:hover{color:#ef4444}
.cart-footer{padding:16px 20px;border-top:1px solid var(--border)}
.cart-total{font-size:16px;font-weight:700;color:var(--fg);margin-bottom:12px;text-align:right}
.cart-empty-msg{text-align:center;padding:32px;color:var(--fg-3);font-size:14px}
.quot-form{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.quot-form h3{font-size:15px;font-weight:700;color:var(--fg);margin-bottom:2px}
.quot-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quot-field{display:flex;flex-direction:column;gap:4px}
.quot-field label{font-size:12px;font-weight:600;color:var(--fg-2);text-transform:uppercase;letter-spacing:.04em}
.quot-field input,.quot-field textarea{padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);color:var(--fg);font-family:'Sora',sans-serif;font-size:13px}
.quot-field input:focus,.quot-field textarea:focus{outline:2px solid var(--green);border-color:transparent}
.quot-field textarea{resize:vertical;min-height:60px}
.quot-actions{display:flex;gap:10px;margin-top:4px}
.btn-quot{flex:1;padding:12px;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.btn-quot-send{background:var(--green);color:#fff}
.btn-quot-send:hover{background:var(--green-dark)}
.btn-quot-cancel{background:var(--surface-2);color:var(--fg)}
.quot-status{text-align:center;font-size:13px;padding:8px;border-radius:8px;display:none}
.quot-status.ok{background:#d1fae5;color:#065f46;display:block}
.quot-status.err{background:#fee2e2;color:#991b1b;display:block}
.btn-cart{padding:11px 18px;background:#F97316;color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.btn-cart:hover{background:#ea6a0a}
@media(max-width:500px){.quot-row{grid-template-columns:1fr}}
</style>

let fil=[...ALL],cat='',catFile='',q='',srt='default',pg=1;
let loaded=new Set(['']);// categorías ya cargadas ('' = todas iniciales)
let TC=20;// tipo de cambio USD→MXN; se actualiza al cargar
const fmt=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',currencyDisplay:'code'}).format(n*TC);
fetch('https://open.er-api.com/v6/latest/USD')
  .then(r=>r.json())
  .then(d=>{if(d&&d.rates&&d.rates.MXN){TC=d.rates.MXN;render();}})
  .catch(()=>{});

function loadCat(file,catName,cb){
  if(loaded.has(catName)){cb();return;}
  document.getElementById('loadingBar').textContent='Cargando '+catName+'...';
  fetch(file)
    .then(r=>r.json())
    .then(data=>{
      // Reemplazar los productos de esta categoría con los completos
      ALL=ALL.filter(p=>p[P.C]!==catName).concat(data);
      loaded.add(catName);
      document.getElementById('loadingBar').textContent='';
      cb();
    })
    .catch(()=>{document.getElementById('loadingBar').textContent='';cb();});
}

function filter(){
  if(catFile&&!loaded.has(cat)){
    loadCat(catFile,cat,()=>filter());
    return;
  }
  fil=ALL.filter(p=>{
    const mc=!cat||p[P.C]===cat;
    const qs=q.toLowerCase();
    const ms=!qs||p[P.N].toLowerCase().includes(qs)||p[P.M].toLowerCase().includes(qs)||(p[P.SKU]||'').toLowerCase().includes(qs);
    return mc&&ms;
  });
  if(srt==='price-asc')fil.sort((a,b)=>a[P.PR]-b[P.PR]);
  else if(srt==='price-desc')fil.sort((a,b)=>b[P.PR]-a[P.PR]);
  else if(srt==='name')fil.sort((a,b)=>a[P.N].localeCompare(b[P.N],'es'));
  pg=1;render();
}

function render(){
  const grid=document.getElementById('productsGrid');
  const empty=document.getElementById('emptyState');
  document.getElementById('resultsCount').textContent=fil.length.toLocaleString('es-MX')+' productos';
  const tot=Math.ceil(fil.length/PER);
  const start=(pg-1)*PER;
  const page=fil.slice(start,start+PER);
  renderPags(tot);
  if(!fil.length){grid.innerHTML='';empty.hidden=false;return;}
  empty.hidden=true;
  grid.innerHTML=page.map((p,i)=>{
    const gi=start+i;
    return '<div class="product-card" onclick="openModal('+gi+')">'
      +'<div class="card-img-wrap">'
      +(p[P.IM]?'<img class="card-img" src="'+p[P.IM]+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">':'')
      +'<div class="card-no-img" style="'+(p[P.IM]?'display:none':'')+'">&#128230;</div>'
      +'</div><div class="card-body">'
      +'<div class="card-brand">'
      +(p[P.ML]?'<img class="card-brand-logo" src="'+p[P.ML]+'" alt="" onerror="this.style.display=\'none\'">':'')
      +'<span class="card-brand-name">'+p[P.M]+'</span></div>'
      +'<div class="card-title">'+p[P.N]+'</div>'
      +(p[P.SKU]?'<div class="card-sku">'+p[P.SKU]+'</div>':'')
      +'<div class="card-price">'+fmt(p[P.PR])+'<span class="card-price-label">Sin IVA</span></div>'
      +'<div class="card-stock">&#10003; En existencia</div>'
      +'<button class="card-cta">Ver detalle →</button>'
      +'</div></div>';
  }).join('');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPags(tot){
  const html=()=>{
    if(tot<=1)return '';
    let b='<button class="page-btn" onclick="goPage('+(pg-1)+')" '+(pg===1?'disabled':'')+'>‹</button>';
    const r=[];
    for(let i=1;i<=tot;i++){
      if(i===1||i===tot||Math.abs(i-pg)<=2)r.push(i);
      else if(r[r.length-1]!=='…')r.push('…');
    }
    r.forEach(x=>{
      if(x==='…')b+='<span class="page-info">…</span>';
      else b+='<button class="page-btn'+(x===pg?' active':'')+'" onclick="goPage('+x+')">'+x+'</button>';
    });
    b+='<button class="page-btn" onclick="goPage('+(pg+1)+')" '+(pg===tot?'disabled':'')+'>›</button>';
    return b;
  };
  document.getElementById('paginationTop').innerHTML=html();
  document.getElementById('paginationBottom').innerHTML=html();
}

function goPage(p){
  const tot=Math.ceil(fil.length/PER);
  if(p<1||p>tot)return;pg=p;render();
}

    cat='';catFile='';
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));

// ── CARRITO ──────────────────────────────────────────────────────────────
let cart=[]; // [{id,sku,nombre,marca,imagen,precio,qty}]

function cartTotal(){return cart.reduce((s,i)=>s+i.precio*i.qty,0);}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}

function addToCart(gi){
  const p=fil[gi];if(!p)return;
  const id=p[P.ID];
  const ex=cart.find(x=>x.id===id);
  if(ex){ex.qty++;}
  else{cart.push({id,sku:p[P.SKU],nombre:p[P.N],marca:p[P.M],imagen:p[P.IM],precio:p[P.PR],qty:1});}
  updateCartBadge();
  // Feedback visual
  const btn=document.getElementById('addCartBtn');
  if(btn){btn.textContent='✓ Agregado';btn.style.background='#16a34a';setTimeout(()=>{btn.textContent='Agregar a cotización';btn.style.background='';},1500);}
}

function updateCartBadge(){
  const n=cartCount();
  const badge=document.getElementById('cartBadge');
  const fab=document.getElementById('cartFab');
  badge.textContent=n;
  fab.style.display=n>0?'flex':'none';
}

function openCart(){document.getElementById('cartOverlay').classList.add('open');renderCart();}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');}

function renderCart(){
  const el=document.getElementById('cartItemsList');
  const footer=document.getElementById('cartFooter');
  if(!cart.length){
    el.innerHTML='<div class="cart-empty-msg">&#128722; Tu carrito está vacío.<br>Agrega productos desde el catálogo.</div>';
    footer.style.display='none';return;
  }
  footer.style.display='block';
  el.innerHTML=cart.map((item,idx)=>`
    <div class="cart-item">
      <img class="cart-item-img" src="${item.imagen||''}" alt="" onerror="this.style.opacity='.3'">
      <div>
        <div class="cart-item-brand">${item.marca}</div>
        <div class="cart-item-name">${item.nombre}</div>
        ${item.sku?`<div class="cart-item-brand">${item.sku}</div>`:''}
        <div class="cart-item-controls">
          <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
          <button class="cart-remove" onclick="removeItem(${idx})" title="Eliminar">&#128465;</button>
        </div>
      </div>
      <div class="cart-item-price">${fmt(item.precio*item.qty)}</div>
    </div>`).join('');
  document.getElementById('cartTotalLine').textContent='Total estimado: '+fmt(cartTotal())+' sin IVA';
}

function changeQty(idx,delta){
  cart[idx].qty+=delta;
  if(cart[idx].qty<=0)cart.splice(idx,1);
  updateCartBadge();renderCart();
}
function removeItem(idx){cart.splice(idx,1);updateCartBadge();renderCart();}

function sendQuote(){
  const nombre=document.getElementById('qNombre').value.trim();
  const empresa=document.getElementById('qEmpresa').value.trim();
  const tel=document.getElementById('qTel').value.trim();
  const email=document.getElementById('qEmail').value.trim();
  const notas=document.getElementById('qNotas').value.trim();
  const status=document.getElementById('quotStatus');
  if(!nombre||!email||!cart.length){
    status.className='quot-status err';
    status.textContent='Por favor llena nombre, correo y agrega al menos un producto.';
    return;
  }
  const itemsText=cart.map(i=>`• ${i.nombre} (${i.sku||'—'}) x${i.qty} = ${fmt(i.precio*i.qty)}`).join('\n');
  const totalText=fmt(cartTotal())+' sin IVA';
  const params={
    to_name:'Equipo Sic Celaya',
    from_name:nombre,
    empresa:empresa||'—',
    telefono:tel||'—',
    reply_to:email,
    email_cliente:email,
    notas:notas||'—',
    productos:itemsText,
    total:totalText,
    tc:'TC aprox: '+TC.toFixed(2)+' MXN/USD'
  };
  const btn=document.getElementById('sendQuoteBtn');
  btn.disabled=true;btn.textContent='Enviando...';
