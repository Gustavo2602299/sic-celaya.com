<title>Catálogo de Productos — Sic Celaya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Catálogo de productos de TI: redes, videovigilancia, control de acceso, energía y más. Sic Celaya SA de CV, Celaya Guanajuato.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap">
<style>
:root {
  --bg:#F5F7F5; --surface:#fff; --surface-2:#EBF2ED; --border:#D3E0D7;
  --fg:#0F1A13; --fg-2:#3A4F3F; --fg-3:#7A9080;
  --green:#1B5E42; --green-dark:#124030; --green-light:#E4F0EB;
  --orange:#F97316; --orange-light:#FEF0E6;
  --shadow-sm:0 1px 3px rgba(15,26,19,.07); --shadow:0 4px 16px rgba(15,26,19,.09);
  --shadow-lg:0 12px 40px rgba(15,26,19,.13);
  --radius:12px; --radius-lg:18px;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A120D;--surface:#111A14;--surface-2:#182210;--border:#243020;
  --fg:#E2EDE5;--fg-2:#8AA890;--fg-3:#4D6652;
  --green:#3DB87A;--green-dark:#2DA068;--green-light:#0D2718;
  --orange:#FB923C;--orange-light:#2D1500;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A120D;--surface:#111A14;--surface-2:#182210;--border:#243020;
  --fg:#E2EDE5;--fg-2:#8AA890;--fg-3:#4D6652;
  --green:#3DB87A;--green-dark:#2DA068;--green-light:#0D2718;
  --orange:#FB923C;--orange-light:#2D1500;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6;
  background:var(--bg);color:var(--fg);
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:101}
img{max-width:100%;display:block}
.container{max-width:1200px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;
  background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--shadow-sm);}
.nav-inner{display:flex;align-items:center;height:62px;gap:12px}
.nav-logo img{height:36px;width:auto}
.nav-title{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--fg);margin-left:4px}
.nav-title small{display:block;font-size:11px;font-weight:400;color:var(--fg-3)}
.nav-back{margin-left:auto;padding:8px 16px;background:var(--green-light);color:var(--green);
  border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
.nav-back:hover{background:var(--green);color:#fff}

/* HERO */
.hero{background:var(--green);padding:36px 0 32px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 90% 50%,rgba(255,255,255,.07) 0%,transparent 70%);
  pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.65);margin-bottom:10px}
.hero-title{font-family:'Sora',sans-serif;font-size:clamp(22px,3vw,34px);font-weight:800;
  color:#fff;letter-spacing:-.02em;margin-bottom:8px}
.hero-sub{font-size:14px;color:rgba(255,255,255,.75);max-width:500px}
.hero-count{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;color:var(--orange);display:inline}

/* TOOLBAR */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 0;position:sticky;top:62px;z-index:90}
.toolbar-inner{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--fg-3);pointer-events:none}
#searchInput{width:100%;padding:9px 12px 9px 38px;border:1px solid var(--border);
  border-radius:9px;background:var(--bg);color:var(--fg);font-size:14px;outline:none}
#searchInput:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-light)}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--border);background:var(--surface);color:var(--fg-2);
  transition:all .12s;white-space:nowrap}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.sort-select{padding:8px 12px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg);color:var(--fg);font-size:13px;cursor:pointer;outline:none}

/* GRID */
.catalog-layout{display:grid;grid-template-columns:1fr;gap:20px;padding:24px 0 48px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  overflow:hidden;transition:box-shadow .18s,transform .18s,border-color .18s;cursor:pointer}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);border-color:var(--green)}
.card-img{width:100%;aspect-ratio:1;object-fit:contain;padding:16px;background:var(--surface)}
.card-img-placeholder{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:40px;background:var(--surface-2);color:var(--fg-3)}
.card-body{padding:14px 16px 16px}
.card-brand{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.card-brand-logo{height:16px;width:auto;object-fit:contain;opacity:.8}
.card-brand-name{font-size:11px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.04em}
.card-title{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--fg);
  line-height:1.35;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sku{font-size:11px;color:var(--fg-3);margin-bottom:10px;font-family:monospace}
.card-price{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--green)}
.card-price-label{font-size:10px;color:var(--fg-3);font-weight:400;display:block;margin-top:1px}
.card-stock{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:99px;margin-top:8px}
.in-stock{background:var(--green-light);color:var(--green)}
.card-cta{width:100%;margin-top:12px;padding:9px;background:var(--green);color:#fff;
  border:none;border-radius:9px;font-family:'Sora',sans-serif;font-weight:700;
  font-size:13px;cursor:pointer;transition:background .15s}
.card-cta:hover{background:var(--green-dark)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);max-width:680px;width:100%;
  max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);
  transform:scale(.96);transition:transform .2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;
  padding:20px 20px 0;gap:12px}
.modal-close{background:none;border:none;cursor:pointer;color:var(--fg-3);padding:4px;
  border-radius:6px;font-size:20px;line-height:1;flex-shrink:0}
.modal-close:hover{color:var(--fg);background:var(--surface-2)}
.modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.modal-img{aspect-ratio:1;object-fit:contain;width:100%;border-radius:12px;
  background:var(--surface-2);padding:16px}
.modal-info{}
.modal-brand{font-size:12px;font-weight:700;color:var(--fg-3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.modal-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:var(--fg);
  line-height:1.3;margin-bottom:12px}
.modal-price-big{font-family:'Sora',sans-serif;font-size:32px;font-weight:800;color:var(--green);
  margin-bottom:4px}
.modal-price-note{font-size:11px;color:var(--fg-3);margin-bottom:16px}
.modal-specs{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.spec-row{display:flex;padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px}
.spec-row:last-child{border-bottom:none}
.spec-label{color:var(--fg-3);width:90px;flex-shrink:0;font-weight:500}
.spec-val{color:var(--fg)}
.modal-features{margin-top:16px}
.modal-features h4{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;
  color:var(--fg);margin-bottom:8px}
.feature-item{display:flex;gap:8px;font-size:13px;color:var(--fg-2);margin-bottom:5px;line-height:1.4}
.feature-item::before{content:"✓";color:var(--green);font-weight:700;flex-shrink:0}
.modal-cta-row{padding:0 20px 20px;display:flex;gap:10px}
.btn-primary{padding:12px 24px;background:var(--green);color:#fff;border:none;border-radius:10px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
  flex:1;transition:background .15s}
.btn-primary:hover{background:var(--green-dark)}
.btn-whatsapp{padding:12px 20px;background:#25D366;color:#fff;border:none;border-radius:10px;
  font-family:'Sora',sans-serif;font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:8px;text-decoration:none;transition:opacity .15s}
.btn-whatsapp:hover{opacity:.9}

/* EMPTY */
.empty{text-align:center;padding:64px 20px;color:var(--fg-3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.results-count{font-size:13px;color:var(--fg-3);margin-bottom:16px}

/* RESPONSIVE */
@media(max-width:700px){
  .modal-body{grid-template-columns:1fr}
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .toolbar-inner{gap:8px}
}
@media(max-width:500px){
  .products-grid{grid-template-columns:1fr 1fr}
  .filter-chips{display:none}
}
</style>

</div>

function fmtMXN(n){ return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n); }

let filtered = [...PRODUCTS];
let activeCategory = '';
let searchTerm = '';
let sortMode = 'default';

function applyFilters(){
  filtered = PRODUCTS.filter(p => {
    const matchCat = !activeCategory || p.categoria === activeCategory;
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || 
      p.nombre.toLowerCase().includes(q) ||
      p.marca.toLowerCase().includes(q) ||
      (p.sku||'').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  if(sortMode === 'price-asc') filtered.sort((a,b)=>a.precio-b.precio);
  else if(sortMode === 'price-desc') filtered.sort((a,b)=>b.precio-a.precio);
  else if(sortMode === 'name') filtered.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  renderGrid();
}

function renderGrid(){
  const grid = document.getElementById('productsGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resultsCount');
  count.textContent = filtered.length + ' productos';
  if(!filtered.length){ grid.innerHTML=''; empty.hidden=false; return; }
  empty.hidden=true;
  grid.innerHTML = filtered.map((p,i) => `
    <div class="product-card" onclick="openModal(${i})">
      ${p.imagen 
        ? `<img class="card-img" src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-img-placeholder" style="${p.imagen?'display:none':''}">📦</div>
      <div class="card-body">
        <div class="card-brand">
          ${p.marca_logo ? `<img class="card-brand-logo" src="${p.marca_logo}" alt="${p.marca}" onerror="this.style.display='none'">` : ''}
          <span class="card-brand-name">${p.marca}</span>
        </div>
        <div class="card-title">${p.nombre}</div>
        ${p.sku ? `<div class="card-sku">${p.sku}</div>` : ''}
        <div class="card-price">${fmtMXN(p.precio)}<span class="card-price-label">Sin IVA</span></div>
        <div class="card-stock in-stock">✓ En existencia</div>
        <button class="card-cta">Ver detalle →</button>
      </div>
    </div>
  `).join('');
  // Update filtered index for modal
  window._filtered = filtered;
}

function openModal(idx){
  const p = window._filtered[idx];
  if(!p) return;
  const body = document.getElementById('modalBody');
  const cta = document.getElementById('modalCta');
  body.innerHTML = `
    <div>
      ${p.imagen 
        ? `<img class="modal-img" src="${p.imagen}" alt="${p.nombre}" onerror="this.src=''">`
        : `<div class="modal-img" style="display:flex;align-items:center;justify-content:center;font-size:64px">📦</div>`}
    </div>
    <div class="modal-info">
      <div class="modal-brand">${p.marca}</div>
      <div class="modal-title">${p.nombre}</div>
      <div class="modal-price-big">${fmtMXN(p.precio)}</div>
      <div class="modal-price-note">Precio sin IVA · +22% sobre costo de lista</div>
      <div class="modal-specs">
        ${p.sku ? `<div class="spec-row"><span class="spec-label">Modelo</span><span class="spec-val">${p.sku}</span></div>` : ''}
        <div class="spec-row"><span class="spec-label">Categoría</span><span class="spec-val">${p.categoria}</span></div>
        ${p.garantia ? `<div class="spec-row"><span class="spec-label">Garantía</span><span class="spec-val">${p.garantia}</span></div>` : ''}
        <div class="spec-row"><span class="spec-label">Existencia</span><span class="spec-val">${p.existencia} piezas</span></div>
      </div>
      ${p.caracteristicas && p.caracteristicas.length ? `
        <div class="modal-features">
          <h4>Características</h4>
          ${p.caracteristicas.map(c=>`<div class="feature-item">${c}</div>`).join('')}

function closeModal(e){ if(e.target===document.getElementById('modalOverlay')) closeModalBtn(); }
function closeModalBtn(){ 
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Events
document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value; applyFilters();
});
document.getElementById('filterChips').addEventListener('click', e=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeCategory = chip.dataset.cat;
  applyFilters();
});
document.getElementById('sortSelect').addEventListener('change', e=>{
  sortMode = e.target.value; applyFilters();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModalBtn(); });

// Init
document.getElementById('heroCount').textContent = PRODUCTS.length;
applyFilters();
</script>
